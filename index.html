<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Krunked Lumia</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000000'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='%2329adff'/%3E%3Cpolygon points='16,9 23,16 16,23 9,16' fill='%23fff7f2'/%3E%3Cpolygon points='16,13 19,16 16,19 13,16' fill='%23ff004d'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="320" height="180" tabindex="0" aria-label="Krunked Lumia"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
