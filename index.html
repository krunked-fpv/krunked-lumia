<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Krunked Lumia</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="320" height="180" aria-label="Krunked Lumia"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
